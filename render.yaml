# JobUz - Render.com deploy konfiguratsiyasi

databases:
  - name: jobuz-db
    databaseName: jobuz
    plan: free

services:
  - type: web
    name: jobuz-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobuz-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://jobuz-web.onrender.com"
      - key: TELEGRAM_POLLING
        value: "false"
      - key: NODE_VERSION
        value: "18"

  - type: web
    name: jobuz-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://jobuz-api.onrender.com"
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        value: "efwastrh_bot"
      - key: NODE_VERSION
        value: "18"
