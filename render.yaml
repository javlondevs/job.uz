# JobUz - Render.com deploy konfiguratsiyasi
# Dashboard > Blueprint > shu faylni tanlab deploy qiling

databases:
  - name: jobuz-db
    databaseName: jobuz
    plan: free

services:
  # Backend API
  - type: web
    name: jobuz-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobuz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # dashboardda frontend URL'ni kiritasiz
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # ixtiyoriy
      - key: TELEGRAM_CHANNEL_ID
        sync: false   # ixtiyoriy (masalan @jobuz_kanali)

  # Frontend - SSR uchun Node Web Service sifatida
  # (bosh sahifa server tomonda vakansiyalarni oladi - SEO foydali)
  - type: web
    name: jobuz-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false   # masalan https://jobuz-api.onrender.com
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false
